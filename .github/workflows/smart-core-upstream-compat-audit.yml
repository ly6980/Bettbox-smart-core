name: Smart Core Upstream Compatibility Audit

on:
  workflow_dispatch:
  push:
    branches:
      - mihomo-smart
    paths:
      - '.github/workflows/smart-core-upstream-compat-audit.yml'
      - 'core/**'
      - 'android/core/**'
      - 'lib/clash/**'
      - 'lib/models/core.dart'
      - 'setup.dart'

permissions:
  contents: read

jobs:
  upstream-snapshot:
    name: Snapshot upstream versions and interface expectations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v6
        with:
          ref: mihomo-smart
          fetch-depth: 1

      - name: Record upstream releases and repository metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, urllib.error, urllib.request

          repos = [
              "vernesong/mihomo",
              "appshubcc/Bettbox",
              "chen08209/FlClash",
              "clash-verge-rev/clash-verge-rev",
              "mihomo-party-org/clash-party",
          ]
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "Bettbox-Smart-Core-Upstream-Audit",
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      return json.load(response), None
              except Exception as exc:
                  return None, str(exc)

          rows = []
          for name in repos:
              repo, repo_error = get("https://api.github.com/repos/" + name)
              release, release_error = get("https://api.github.com/repos/" + name + "/releases/latest")
              if release is None:
                  release = {}
              if repo is None:
                  repo = {}
              rows.append({
                  "repository": name,
                  "default_branch": repo.get("default_branch"),
                  "pushed_at": repo.get("pushed_at"),
                  "license": (repo.get("license") or {}).get("spdx_id"),
                  "latest_release_tag": release.get("tag_name"),
                  "latest_release_published_at": release.get("published_at"),
                  "release_assets": [a.get("name") for a in release.get("assets", [])],
                  "repository_lookup_error": repo_error,
                  "release_lookup_error": release_error,
              })

          output = {
              "captured_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "tested_commit": os.environ.get("GITHUB_SHA"),
              "branch": os.environ.get("GITHUB_REF_NAME"),
              "repositories": rows,
              "limitations": [
                  "Latest-release endpoint may be empty for projects that publish prereleases only.",
                  "This is metadata reconnaissance, not proof of source or runtime compatibility.",
                  "Do not copy code without checking license and attribution."
              ],
          }
          with open("upstream-compatibility-snapshot.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, ensure_ascii=False)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("# Upstream compatibility snapshot\n\n")
              f.write(f"- Branch: `{output['branch']}`\n- Commit: `{output['tested_commit']}`\n")
              f.write(f"- Captured: {output['captured_at_utc']}\n\n")
              f.write("| Repository | Default branch | Latest stable release | Release date | License |\n|---|---|---|---|---|\n")
              for row in rows:
                  f.write("| {repository} | {default_branch} | {latest_release_tag} | {latest_release_published_at} | {license} |\n".format(**{k: row.get(k) or "n/a" for k in ["repository","default_branch","latest_release_tag","latest_release_published_at","license"]}))
              f.write("\n## Limits\n\n- Metadata snapshot only; no runtime compatibility is inferred.\n- Prerelease-only projects may not have a value from the latest-stable endpoint.\n")
          print(json.dumps(output, indent=2, ensure_ascii=False))
          PY

      - name: Audit local bridge contract and workflow safety
        shell: bash
        run: |
          set -euo pipefail
          report=local-interface-contract.txt
          {
            echo "Tested commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo
            echo "## Native library references"
            grep -RInE 'libmeta\.so|libcore\.so|System\.loadLibrary|DynamicLibrary\.open|startTUN|stopTun|registerCallbacks|JNI_OnLoad' android/core lib/clash lib/models/core.dart setup.dart --include='*.kt' --include='*.cpp' --include='*.h' --include='*.dart' --include='*.cmake' --include='CMakeLists.txt' 2>/dev/null || true
            echo
            echo "## Experimental workflow triggers"
            grep -RInE "tags:|workflow_dispatch:|branches:|mihomo-smart|contents: write|actions: write" .github/workflows --include='*.yml' --include='*.yaml' || true
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          cat "$report"

      - name: Upload audit snapshot
        uses: actions/upload-artifact@v4
        with:
          name: smart-core-upstream-compatibility-${{ github.sha }}
          path: |
            upstream-compatibility-snapshot.json
            local-interface-contract.txt
          if-no-files-found: error
          retention-days: 30
